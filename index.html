<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#182433" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Theme UI" />
    <script src="/theme-init.js"></script>
    <title>Theme UI</title>
    <style>
      /* The loading screen: from the first paint until the app is ready (lib/boot.ts finishes it).
         The bar creeps toward the end but stops short of it; only finishBoot() fills it. */
      #boot {
        position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: var(--color-bg, #f6f8fb); color: var(--color-neutral-700, #475467);
        font: 500 14px/1.4 Inter, "Noto Sans Thai", system-ui, sans-serif;
        transition: opacity 0.25s ease;
      }
      #boot.boot-out { opacity: 0; pointer-events: none; }
      html[data-theme="dark"] #boot { background: var(--color-bg, #121b27); color: var(--color-neutral-700, #c4ccd8); }
      #boot img { width: 56px; height: 56px; margin-bottom: 6px; }
      #boot .boot-track {
        box-sizing: border-box; width: min(320px, 80vw); height: 34px; padding: 4px;
        border: 3px solid var(--color-text, #182433); border-radius: 999px;
      }
      #boot .boot-fill {
        height: 100%; width: 8%; border-radius: 999px; background: var(--color-text, #182433);
        animation: boot-creep 20s linear forwards;
      }
      @keyframes boot-creep { 0% { width: 8%; } 10% { width: 40%; } 30% { width: 65%; } 60% { width: 82%; } 100% { width: 92%; } }
      html[data-motion="reduce"] #boot .boot-fill { animation: none; width: 60%; }
      @media (prefers-reduced-motion: reduce) {
        html:not([data-motion="full"]) #boot .boot-fill { animation: none; width: 60%; }
      }
      /* the words follow the saved language (theme-init.js sets <html lang>); English when nothing is saved */
      html[lang="th"] #boot .boot-en, html:not([lang="th"]) #boot .boot-th { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
        <img src="/favicon.svg" alt="" />
        <div class="boot-track" aria-hidden="true"><div class="boot-fill"></div></div>
        <span class="boot-th">กำลังโหลด…</span>
        <span class="boot-en">Loading…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
