# Publishes the demo to GitHub Pages on every push to main: https://littihai.github.io/Theme-UI/
# The app is built under the repository's path (--base-href) and build/web/404.html is a copy of index.html so a deep
# link (/components, /login) still opens the app: Pages serves 404.html for unknown paths and the router takes over.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /Theme-UI/
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
