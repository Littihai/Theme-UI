# Every push and pull request: the analyzer, the dictionary check, the tests, and a web build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: dart run tool/check_i18n.dart
      - run: flutter test
      - run: flutter build web --release
