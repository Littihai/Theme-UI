<!DOCTYPE html>
<html lang="en">
<head>
  <!-- replaced by the value of `flutter build web --base-href` (GitHub Pages serves the app under /Theme-UI/) -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A Flutter starter for internal business applications: the shell, the design system and the UI kit.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Theme UI">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Theme UI</title>

  <script>
    // The saved colour scheme, applied before Flutter starts, so a dark-mode person never sees a white flash.
    // shared_preferences stores the app's "app.theme" under "flutter.app.theme" (keep the prefix in step with
    // lib/constants/brand.dart). "system" or nothing = follow the OS.
    (function () {
      var pref = null;
      try {
        var raw = localStorage.getItem("flutter.app.theme");
        if (raw) pref = raw.replace(/^"|"$/g, "");
      } catch (e) { /* storage blocked: follow the OS */ }
      var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.style.background = dark ? "#121b27" : "#f6f8fb";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #f6f8fb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    html[data-theme="dark"] body { background: #121b27; }
    /* the loading screen: the mark and a thin bar, until Flutter paints its first frame */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .25s ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot svg { width: 44px; height: 44px; }
    #boot .bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(24,36,51,.12); overflow: hidden; }
    html[data-theme="dark"] #boot .bar { background: rgba(230,233,238,.14); }
    #boot .bar i { display: block; width: 40%; height: 100%; background: #066fd1; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    html[data-theme="dark"] #boot .bar i { background: #4299e1; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 40 L90 62 L50 84 L10 62 Z" fill="none" stroke="#066fd1" stroke-opacity=".55" stroke-width="7" stroke-linejoin="round"/>
      <path d="M50 18 L90 40 L50 62 L10 40 Z" fill="#066fd1"/>
    </svg>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var b = document.getElementById("boot");
      if (!b) return;
      b.classList.add("gone");
      setTimeout(function () { b.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
